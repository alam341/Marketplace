<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="icon" href="img/logo-adsy.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracking Resi — MarketDash</title>
<link rel="stylesheet" href="css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-slot"></div>
  <div class="main-content">
    <div id="header-slot"></div>
    <div class="page">
      <div id="pageContent"></div>
    </div>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/upload.js"></script>
<script src="js/tracking.js"></script>
<script>
let _user, _profiles = [];

(async () => {
  _user = await requireAuth();
  if (!_user) return;

  _profiles = await dbGetAllProfiles().catch(() => []);
  _user._color = _user.role === 'spv' ? '#EF233C' : assignUserColor(_profiles, _user.id);

  renderLayout('tracking', _user);
  await loadTracking();
})();
</script>
</body>
</html>
