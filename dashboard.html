<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — MarketDash</title>
<link rel="stylesheet" href="css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-slot"></div>
  <div class="main-content">
    <div id="header-slot"></div>
    <div class="page">
      <div id="dateFilterContainer"></div>
      <div id="pageContent"></div>
    </div>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/upload.js"></script>
<script>
let _user, _profiles = [], _revChart, _donutChart, _teamChart;

(async () => {
  _user = await requireAuth();
  if (!_user) return;

  _profiles = await dbGetAllProfiles().catch(() => []);
  _user._color = _user.role === 'spv' ? '#EF233C' : assignUserColor(_profiles, _user.id);

  renderLayout('dashboard', _user);
  renderDateFilter('dateFilterContainer', 'refreshPage');
  await refreshPage();
})();

async function refreshPage() {
  showLoading();
  try {
    const { from, to } = window._dateFilter;
    const filters = { dateFrom: from, dateTo: to };
    if (_user.role !== 'spv') filters.advId = _user.id;
    const trx = await dbGetAllMarketplaceOrders(filters);
    const myTrx = trx;

    renderDashboard(myTrx);
  } catch(e) {
    showError('Gagal memuat data: ' + e.message);
  }
}

function renderDashboard(trx) {
  const isSPV = _user.role === 'spv';
  const stats  = calcStats(trx);
  const monthly = calcMonthlyRevenue(trx);

  const months  = Object.keys(monthly).sort();
  const labels  = months.map(m => {
    const [y,mo] = m.split('-');
    return ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][parseInt(mo)-1] + ' ' + y.slice(2);
  });
  const totals  = months.map(m => monthly[m].total);
  const shopeeD = months.map(m => monthly[m].shopee);
  const lazadaD = months.map(m => monthly[m].lazada);
  const tiktokD = months.map(m => monthly[m].tiktok);

  const totalShopee = shopeeD.reduce((s,v)=>s+v,0);
  const totalLazada = lazadaD.reduce((s,v)=>s+v,0);
  const totalTiktok = tiktokD.reduce((s,v)=>s+v,0);

  // Team leaderboard (SPV)
  let teamSection = '';
  if (isSPV && _profiles.length) {
    const teamMap = {};
    trx.filter(t=>t.status!=='dibatalkan').forEach(t => {
      if (!teamMap[t.adv_id]) teamMap[t.adv_id] = { omset:0, qty:0 };
      teamMap[t.adv_id].omset += t.total || 0;
      teamMap[t.adv_id].qty   += t.qty || 0;
    });
    const team = _profiles.map((p,i) => ({
      ...p, _color: ADV_COLORS[i % ADV_COLORS.length],
      omset: teamMap[p.id]?.omset || 0,
      qty:   teamMap[p.id]?.qty   || 0,
    })).sort((a,b) => b.omset - a.omset);
    const maxOmset = team[0]?.omset || 1;
    const ranks = ['gold','silver','bronze',''];
    teamSection = `
      <div class="two-col">
        <div class="card">
          <div class="card-header"><div class="card-header-left"><h3>Leaderboard Tim</h3><div class="card-sub">Revenue periode ini per ADV</div></div></div>
          ${team.map((m,i) => `
            <div class="team-item">
              <div class="team-rank ${ranks[i]||''}">${i+1}</div>
              <div class="user-avatar lg" style="background:${m._color}">${m.avatar||'?'}</div>
              <div class="team-info">
                <div class="team-name">${m.name}</div>
                <div class="progress" style="margin-top:6px">
                  <div class="progress-fill" style="width:${(m.omset/maxOmset*100).toFixed(0)}%"></div>
                </div>
              </div>
              <div class="team-value">${fmt(m.omset)}</div>
            </div>
          `).join('')}
        </div>
        <div class="card">
          <div class="card-header"><div class="card-header-left"><h3>Perbandingan Tim per Marketplace</h3></div></div>
          <div class="chart-container" style="height:240px"><canvas id="teamChart"></canvas></div>
        </div>
      </div>
    `;
  }

  document.getElementById('pageContent').innerHTML = `
    <div class="stat-grid">
      <div class="stat-card primary">
        <div class="stat-label">Total Omset Periode</div>
        <div class="stat-value" style="font-size:1.1rem">${fmtFull(stats.totalOmset)}</div>
        <div class="stat-sub">${stats.totalOrders} order berhasil</div>
        <div class="stat-icon">💰</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Order</div>
        <div class="stat-value">${stats.totalOrders}</div>
        <div class="stat-sub">Transaksi berhasil</div>
        <div class="stat-icon">📋</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">${isSPV ? 'Total ADV Tim' : 'Total Qty Terjual'}</div>
        <div class="stat-value">${isSPV ? _profiles.length : stats.totalQty.toLocaleString('id-ID')}</div>
        <div class="stat-sub">${isSPV ? 'Anggota aktif' : 'Unit produk'}</div>
        <div class="stat-icon">${isSPV ? '👥' : '📦'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Dibatalkan</div>
        <div class="stat-value" style="color:var(--danger)">${stats.cancelled}</div>
        <div class="stat-sub">Order batal</div>
        <div class="stat-icon">❌</div>
      </div>
    </div>

    <div class="two-col">
      <div class="card">
        <div class="card-header">
          <div class="card-header-left"><h3>Tren Omset</h3><div class="card-sub">Periode terpilih</div></div>
        </div>
        <div class="chart-container" style="height:230px"><canvas id="revenueChart"></canvas></div>
      </div>
      <div class="card">
        <div class="card-header">
          <div class="card-header-left"><h3>Per Marketplace</h3><div class="card-sub">Distribusi periode ini</div></div>
        </div>
        <div style="display:flex;gap:16px;align-items:center;height:160px">
          <div style="width:130px;height:130px;flex-shrink:0"><canvas id="donutChart"></canvas></div>
          <div class="donut-legend" style="flex:1">
            ${[
              { label:'Shopee', color:'#EE4D2D', val:totalShopee },
              { label:'Lazada', color:'#0F146D', val:totalLazada },
              { label:'TikTok', color:'#666',    val:totalTiktok },
            ].map(item => `
              <div class="donut-item">
                <div class="donut-name"><div class="donut-dot" style="background:${item.color}"></div>${item.label}</div>
                <div class="donut-val">${fmt(item.val)}</div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    </div>

    ${teamSection}

    <div class="card">
      <div class="card-header">
        <div class="card-header-left"><h3>Transaksi Terbaru</h3><div class="card-sub">${trx.length} transaksi di periode ini</div></div>
        <a href="transaction.html" class="btn btn-outline btn-sm">Lihat Semua</a>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>ID</th>${isSPV?'<th>ADV</th>':''}
            <th>Produk</th><th>Marketplace</th><th>Tanggal</th><th>Qty</th><th>Total</th><th>Status</th>
          </tr></thead>
          <tbody>
            ${trx.slice(0,8).map(t => {
              const p = t.profiles || {};
              const color = assignUserColor(_profiles, t.adv_id);
              return `<tr>
                <td style="font-family:monospace;font-size:.73rem;color:var(--text-3)">${t.id}</td>
                ${isSPV?`<td><div style="display:flex;align-items:center;gap:6px">
                  <div class="user-avatar sm" style="background:${color};font-size:.65rem">${p.avatar||'?'}</div>
                  <span style="font-size:.82rem">${p.name?.split(' ')[0]||'-'}</span>
                </div></td>`:''}
                <td><div style="font-weight:600">${t.product||'-'}</div><div style="font-size:.72rem;color:var(--text-3)">${t.sku}</div></td>
                <td>${badgeMarketplace(t.marketplace)}</td>
                <td style="color:var(--text-3);font-size:.82rem">${t.date}</td>
                <td style="font-weight:700">${t.qty}</td>
                <td style="font-weight:800;color:var(--primary)">${fmtFull(t.total||0)}</td>
                <td>${badgeStatus(t.status)}</td>
              </tr>`;
            }).join('')}
            ${!trx.length?`<tr><td colspan="${isSPV?8:7}" class="empty"><div class="icon">📭</div>Belum ada transaksi di periode ini</td></tr>`:''}
          </tbody>
        </table>
      </div>
    </div>
  `;

  const gc = chartGridColor(), tc = chartTextColor();

  if (_revChart)  _revChart.destroy();
  if (_donutChart) _donutChart.destroy();
  if (_teamChart)  _teamChart.destroy();

  _revChart = new Chart(document.getElementById('revenueChart'), {
    type: 'bar',
    data: { labels, datasets: [{
      label: 'Omset',
      data: totals.map(v=>v/1e6),
      backgroundColor: labels.map((_,i)=>i===labels.length-1?'#4361EE':'rgba(67,97,238,.3)'),
      borderRadius:6, borderSkipped:false,
    }]},
    options: { responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{ x:{grid:{display:false},ticks:{color:tc}}, y:{grid:{color:gc},ticks:{color:tc,callback:v=>'Rp'+v+'Jt'}} } }
  });

  _donutChart = new Chart(document.getElementById('donutChart'), {
    type: 'doughnut',
    data: { labels:['Shopee','Lazada','TikTok'],
      datasets:[{ data:[totalShopee,totalLazada,totalTiktok],
        backgroundColor:['#EE4D2D','#0F146D','#666'],
        borderWidth:3, borderColor:isDark()?'#1E293B':'#fff', hoverOffset:6 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'68%', plugins:{legend:{display:false}} }
  });

  // Team chart (SPV)
  if (isSPV && document.getElementById('teamChart') && _profiles.length) {
    const teamMap = {};
    trx.filter(t=>t.status!=='dibatalkan').forEach(t => {
      if (!teamMap[t.adv_id]) teamMap[t.adv_id] = { shopee:0, lazada:0, tiktok:0 };
      if (teamMap[t.adv_id][t.marketplace] !== undefined)
        teamMap[t.adv_id][t.marketplace] += t.total || 0;
    });
    const team = _profiles.map(p => ({ name:p.name.split(' ')[0], ...teamMap[p.id]||{shopee:0,lazada:0,tiktok:0} }));
    _teamChart = new Chart(document.getElementById('teamChart'), {
      type:'bar',
      data:{ labels:team.map(m=>m.name), datasets:[
        { label:'Shopee', data:team.map(m=>m.shopee/1e6), backgroundColor:'#EE4D2D', borderRadius:4 },
        { label:'Lazada', data:team.map(m=>m.lazada/1e6), backgroundColor:'#0F146D', borderRadius:4 },
        { label:'TikTok', data:team.map(m=>m.tiktok/1e6), backgroundColor:'#888',    borderRadius:4 },
      ]},
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'top', labels:{font:{size:11},color:tc} } },
        scales:{ x:{stacked:true,grid:{display:false},ticks:{color:tc}},
                 y:{stacked:true,grid:{color:gc},ticks:{color:tc,callback:v=>'Rp'+v+'Jt'}} } }
    });
  }
}
</script>
</body>
</html>
