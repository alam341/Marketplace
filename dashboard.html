<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — MarketDash</title>
<link rel="stylesheet" href="css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-slot"></div>
  <div class="main-content">
    <div id="header-slot"></div>
    <div class="page" id="pageContent"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
const user = requireAuth();
if (user) {
  renderLayout('dashboard', user);
  renderDashboard(user);
}

function renderDashboard(user) {
  const isSPV = user.role === 'spv';
  const stats  = isSPV ? getSpvStats() : getAdvStats(user.id);
  const page   = document.getElementById('pageContent');

  const teamSection = isSPV ? renderTeamSection() : '';
  const chartData   = isSPV ? getAllMonthly() : getAdvMonthly(user.id);
  const mpData      = isSPV ? getSpvMP() : getAdvMP(user.id);

  page.innerHTML = `
    <!-- Stat Cards -->
    <div class="stat-grid">
      <div class="stat-card primary">
        <div class="stat-label">Total Revenue Bulan Ini</div>
        <div class="stat-value">${fmt(stats.revenue)}</div>
        <div class="stat-sub">vs bulan lalu &nbsp; ${growthBadge(stats.revGrowth)}</div>
        <div class="stat-icon">💰</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Order</div>
        <div class="stat-value">${stats.orders.toLocaleString('id-ID')}</div>
        <div class="stat-sub">Transaksi berhasil</div>
        <div class="stat-icon">📋</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">${isSPV ? 'Total ADV Tim' : 'Total Qty Terjual'}</div>
        <div class="stat-value">${isSPV ? stats.teamSize : stats.qty.toLocaleString('id-ID')}</div>
        <div class="stat-sub">${isSPV ? 'Anggota aktif' : 'Unit produk'}</div>
        <div class="stat-icon">${isSPV ? '👥' : '📦'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Produk Aktif</div>
        <div class="stat-value">${isSPV ? PRODUCTS.length : stats.products}</div>
        <div class="stat-sub">SKU berjalan</div>
        <div class="stat-icon">🏷️</div>
      </div>
    </div>

    <!-- Charts row -->
    <div class="two-col" style="margin-bottom:22px">
      <div class="card">
        <div class="card-header">
          <div class="card-header-left">
            <h3>Tren Revenue</h3>
            <div class="card-sub">Performa 7 bulan terakhir</div>
          </div>
        </div>
        <div class="chart-container" style="height:220px">
          <canvas id="revenueChart"></canvas>
        </div>
      </div>
      <div class="card">
        <div class="card-header">
          <div class="card-header-left">
            <h3>Revenue per Marketplace</h3>
            <div class="card-sub">Distribusi bulan ini</div>
          </div>
        </div>
        <div style="display:flex;gap:20px;align-items:center">
          <div style="width:130px;height:130px;flex-shrink:0">
            <canvas id="donutChart"></canvas>
          </div>
          <div class="donut-legend" style="flex:1">
            ${[
              { label:'Shopee', color:'#EE4D2D', val: mpData.shopee, growth:'+4.2%' },
              { label:'Lazada', color:'#0F146D', val: mpData.lazada, growth:'+2.1%' },
              { label:'TikTok', color:'#1A1A1A', val: mpData.tiktok, growth:'+6.8%' },
            ].map(item => `
              <div class="donut-item">
                <div class="donut-name">
                  <div class="donut-dot" style="background:${item.color}"></div>${item.label}
                </div>
                <div class="donut-val">${fmt(item.val)}</div>
                <div class="donut-growth">${growthBadge(item.growth.replace('%',''))}</div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    </div>

    ${teamSection}

    <!-- Recent Transactions -->
    <div class="card">
      <div class="card-header">
        <div class="card-header-left">
          <h3>Transaksi Terbaru</h3>
          <div class="card-sub">5 transaksi terakhir</div>
        </div>
        <a href="transaction.html" class="btn btn-outline btn-sm">Lihat Semua</a>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>ID Transaksi</th><th>Produk</th><th>Marketplace</th>
            <th>Qty</th><th>Total</th><th>Status</th>
          </tr></thead>
          <tbody>
            ${getRecentTrx(isSPV ? null : user.id).map(t => `
              <tr>
                <td style="font-family:monospace;font-size:.78rem;color:#8A94A6">${t.id}</td>
                <td><div style="font-weight:600">${t.product}</div><div style="font-size:.73rem;color:#8A94A6">${t.sku}</div></td>
                <td>${badgeMarketplace(t.marketplace)}</td>
                <td style="font-weight:700">${t.qty}</td>
                <td style="font-weight:700;color:#4361EE">${fmtFull(t.qty * t.price)}</td>
                <td>${badgeStatus(t.status)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  // Revenue bar chart
  new Chart(document.getElementById('revenueChart'), {
    type: 'bar',
    data: {
      labels: MONTHS,
      datasets: [{
        label: 'Revenue',
        data: chartData.map(v => v / 1e6),
        backgroundColor: MONTHS.map((_, i) => i === MONTHS.length - 1 ? '#4361EE' : '#C7D0FF'),
        borderRadius: 6,
        borderSkipped: false,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false } },
        y: { grid: { color: '#F0F0F0' }, ticks: { callback: v => 'Rp'+v+'Jt' } }
      }
    }
  });

  // Donut chart
  new Chart(document.getElementById('donutChart'), {
    type: 'doughnut',
    data: {
      labels: ['Shopee', 'Lazada', 'TikTok'],
      datasets: [{ data: [mpData.shopee, mpData.lazada, mpData.tiktok],
        backgroundColor: ['#EE4D2D', '#0F146D', '#1A1A1A'],
        borderWidth: 3, borderColor: '#fff',
        hoverOffset: 6 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      cutout: '68%',
      plugins: { legend: { display: false } }
    }
  });

  if (isSPV) renderTeamChart();
}

function renderTeamSection() {
  const team = getTeamRevenue();
  const ranks = ['gold', 'silver', 'bronze', ''];
  const maxVal = team[0].total;
  return `
    <div class="two-col" style="margin-bottom:22px">
      <div class="card">
        <div class="card-header">
          <div class="card-header-left"><h3>Leaderboard Tim</h3><div class="card-sub">Revenue bulan ini per ADV</div></div>
        </div>
        ${team.map((m, i) => `
          <div class="team-item">
            <div class="team-rank ${ranks[i]||''}">${i+1}</div>
            <div class="user-avatar lg" style="background:${['#4361EE','#7B2FBE','#06C270','#FFB703'][i]}">${m.avatar}</div>
            <div class="team-info">
              <div class="team-name">${m.name}</div>
              <div class="progress" style="margin-top:6px;width:100%">
                <div class="progress-fill" style="width:${(m.total/maxVal*100).toFixed(0)}%"></div>
              </div>
            </div>
            <div class="team-value">${fmt(m.total)}</div>
          </div>
        `).join('')}
      </div>
      <div class="card">
        <div class="card-header">
          <div class="card-header-left"><h3>Perbandingan Tim</h3><div class="card-sub">Revenue per ADV per marketplace</div></div>
        </div>
        <div class="chart-container" style="height:220px">
          <canvas id="teamChart"></canvas>
        </div>
      </div>
    </div>
  `;
}

function renderTeamChart() {
  const team = getTeamRevenue();
  new Chart(document.getElementById('teamChart'), {
    type: 'bar',
    data: {
      labels: team.map(m => m.name.split(' ')[0]),
      datasets: [
        { label: 'Shopee', data: team.map(m => m.shopee/1e6), backgroundColor: '#EE4D2D', borderRadius: 4 },
        { label: 'Lazada', data: team.map(m => m.lazada/1e6), backgroundColor: '#0F146D', borderRadius: 4 },
        { label: 'TikTok', data: team.map(m => m.tiktok/1e6), backgroundColor: '#1A1A1A', borderRadius: 4 },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top', labels: { font: { size: 11 } } } },
      scales: {
        x: { stacked: true, grid: { display: false } },
        y: { stacked: true, grid: { color: '#F0F0F0' }, ticks: { callback: v => 'Rp'+v+'Jt' } }
      }
    }
  });
}

function getAdvMP(advId) {
  const d = MONTHLY_REVENUE[advId];
  const i = d.shopee.length - 1;
  return { shopee: d.shopee[i]*1e6, lazada: d.lazada[i]*1e6, tiktok: d.tiktok[i]*1e6 };
}

function getSpvMP() {
  return ['adv1','adv2','adv3','adv4'].reduce((acc, id) => {
    const d = getAdvMP(id);
    acc.shopee += d.shopee; acc.lazada += d.lazada; acc.tiktok += d.tiktok;
    return acc;
  }, { shopee:0, lazada:0, tiktok:0 });
}

function getRecentTrx(advId) {
  let list = advId ? TRANSACTIONS.filter(t => t.adv === advId) : TRANSACTIONS;
  return list.slice(0, 5);
}
</script>
</body>
</html>
