<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil — MarketDash</title>
<link rel="stylesheet" href="css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-slot"></div>
  <div class="main-content">
    <div id="header-slot"></div>
    <div class="page">
      <div id="pageContent"></div>
    </div>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/mood.js"></script>
<script>
let _user, _profiles = [];

const AVATAR_EMOJIS = [
  '😊','🤩','💪','🔥','🦁','🐬','🦅','🦊','🐅','🐺',
  '🦉','🐉','🌟','⚡','🎯','🚀','💎','👑','🏆','🎪',
  '🌈','🍀','🎸','🎨','🌊','🏔️','🌺','🦋','🐆','🦄',
];

(async () => {
  _user = await requireAuth();
  if (!_user) return;
  _profiles = await dbGetAllProfiles().catch(() => []);
  _user._color = _user.role === 'spv' ? '#EF233C' : assignUserColor(_profiles, _user.id);
  renderLayout('profile', _user);
  renderProfilePage();
})();

function renderProfilePage() {
  const color = _user._color || '#4361EE';
  const hasPhoto = !!_user.avatar_url;

  document.getElementById('pageContent').innerHTML = `
    <div style="max-width:600px;margin:0 auto">
      <h2 style="font-weight:800;margin-bottom:4px">Profil Saya</h2>
      <div style="color:var(--text-3);font-size:.85rem;margin-bottom:24px">Kelola informasi dan tampilan akunmu</div>

      <!-- Avatar card -->
      <div class="card" style="margin-bottom:18px">
        <div class="card-header"><div class="card-header-left"><h3>Foto Profil</h3></div></div>
        <div style="display:flex;align-items:center;gap:24px;padding:8px 0">
          <!-- Preview avatar -->
          <div id="avatarPreview" style="
            width:80px;height:80px;border-radius:50%;overflow:hidden;
            background:${color};display:flex;align-items:center;justify-content:center;
            font-size:2rem;flex-shrink:0;border:3px solid var(--border);
          ">
            ${hasPhoto
              ? `<img src="${_user.avatar_url}" style="width:100%;height:100%;object-fit:cover">`
              : (_user.avatar || '?')}
          </div>
          <div style="flex:1">
            <div style="font-weight:700;font-size:1rem;margin-bottom:2px">${_user.name}</div>
            <div style="font-size:.82rem;color:var(--text-3);margin-bottom:12px">${_user.title || _user.role}</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <label style="cursor:pointer">
                <input type="file" accept="image/*" style="display:none" onchange="uploadPhoto(this)">
                <span class="btn btn-primary btn-sm">📷 Upload Foto</span>
              </label>
              ${hasPhoto ? `<button class="btn btn-outline btn-sm" onclick="removePhoto()">Hapus Foto</button>` : ''}
            </div>
            <div style="font-size:.72rem;color:var(--text-3);margin-top:6px">JPG/PNG, maks 2MB</div>
          </div>
        </div>
        <div id="uploadStatus" style="margin-top:8px;font-size:.82rem"></div>
      </div>

      <!-- Pilih Emoji Avatar -->
      <div class="card" style="margin-bottom:18px">
        <div class="card-header"><div class="card-header-left"><h3>Atau Pilih Emoji Avatar</h3><div class="card-sub">Tampil jika belum upload foto</div></div></div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;padding:4px 0">
          ${AVATAR_EMOJIS.map(e => `
            <button onclick="pickEmoji('${e}')" style="
              width:44px;height:44px;border-radius:10px;font-size:1.4rem;cursor:pointer;
              border:2px solid ${_user.avatar===e ? '#4361EE' : 'transparent'};
              background:${_user.avatar===e ? '#EEF0FF' : 'var(--surface-2)'};
              transition:all .15s;
            " title="${e}">${e}</button>
          `).join('')}
        </div>
        <div id="emojiStatus" style="margin-top:10px;font-size:.82rem"></div>
      </div>

      <!-- Info akun -->
      <div class="card">
        <div class="card-header"><div class="card-header-left"><h3>Informasi Akun</h3></div></div>
        <div style="display:flex;flex-direction:column;gap:14px;padding:4px 0">
          <div>
            <div style="font-size:.75rem;font-weight:700;color:var(--text-3);margin-bottom:4px">NAMA LENGKAP</div>
            <div style="font-weight:600">${_user.name}</div>
          </div>
          <div>
            <div style="font-size:.75rem;font-weight:700;color:var(--text-3);margin-bottom:4px">EMAIL</div>
            <div style="font-weight:600">${_user.email || '-'}</div>
          </div>
          <div>
            <div style="font-size:.75rem;font-weight:700;color:var(--text-3);margin-bottom:4px">ROLE</div>
            <div><span class="badge ${_user.role==='spv'?'badge-danger':'badge-success'}">${_user.role?.toUpperCase()}</span></div>
          </div>
          <div>
            <div style="font-size:.75rem;font-weight:700;color:var(--text-3);margin-bottom:4px">JABATAN</div>
            <div style="font-weight:600">${_user.title || '-'}</div>
          </div>
        </div>
      </div>
    </div>
  `;
}

async function uploadPhoto(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) {
    setStatus('uploadStatus', '❌ File terlalu besar, maks 2MB', 'var(--danger)');
    return;
  }

  setStatus('uploadStatus', '⏳ Mengupload...', 'var(--text-3)');
  try {
    const url = await dbUploadAvatar(file);
    await dbUpdateProfile({ avatar_url: url });
    _user.avatar_url = url;

    // Update preview
    document.getElementById('avatarPreview').innerHTML =
      `<img src="${url}" style="width:100%;height:100%;object-fit:cover">`;
    setStatus('uploadStatus', '✅ Foto berhasil diupload!', '#06C270');
    renderProfilePage(); // re-render to show remove button
  } catch(e) {
    setStatus('uploadStatus', '❌ Gagal upload: ' + e.message, 'var(--danger)');
  }
}

async function removePhoto() {
  try {
    await dbUpdateProfile({ avatar_url: null });
    _user.avatar_url = null;
    renderProfilePage();
    showToast('Foto dihapus', 'info');
  } catch(e) {
    showToast('Gagal hapus foto: ' + e.message, 'error');
  }
}

async function pickEmoji(emoji) {
  setStatus('emojiStatus', '⏳ Menyimpan...', 'var(--text-3)');
  try {
    await dbUpdateProfile({ avatar: emoji });
    _user.avatar = emoji;
    setStatus('emojiStatus', '✅ Avatar diperbarui!', '#06C270');
    renderProfilePage();
  } catch(e) {
    setStatus('emojiStatus', '❌ Gagal: ' + e.message, 'var(--danger)');
  }
}

function setStatus(id, msg, color) {
  const el = document.getElementById(id);
  if (el) { el.textContent = msg; el.style.color = color; }
}
</script>
</body>
</html>
