<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — MarketDash</title>
<link rel="stylesheet" href="css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-slot"></div>
  <div class="main-content">
    <div id="header-slot"></div>
    <div class="page">
      <div id="dateFilterContainer"></div>
      <div id="pageContent"></div>
    </div>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/upload.js"></script>
<script>
let _user, _profiles = [], _products = [], _skuSales = {}, _catChart;
let _search = '', _catFilter = '';
const COLORS = ['#4361EE','#EE4D2D','#06C270','#FFB703','#7B2FBE'];

(async () => {
  _user = await requireAuth();
  if (!_user) return;
  _profiles = await dbGetAllProfiles().catch(() => []);
  _user._color = _user.role === 'spv' ? '#EF233C' : assignUserColor(_profiles, _user.id);
  renderLayout('product', _user);
  renderDateFilter('dateFilterContainer', 'refreshPage');
  await refreshPage();
})();

async function refreshPage() {
  showLoading();
  try {
    const { from, to } = window._dateFilter;
    const isSPV = _user.role === 'spv';

    [_products] = await Promise.all([
      dbGetProducts(isSPV ? {} : { advId: _user.id }),
    ]);

    // Sales in period
    const trxFilters = { dateFrom: from, dateTo: to };
    if (!isSPV) trxFilters.advId = _user.id;
    const trx = await dbGetTransactions(trxFilters);
    _skuSales = {};
    trx.filter(t=>t.status!=='dibatalkan').forEach(t => {
      _skuSales[t.sku] = (_skuSales[t.sku]||0) + t.qty;
    });

    const cats = {};
    _products.forEach(p => { cats[p.category||'Lainnya'] = (cats[p.category||'Lainnya']||0)+1; });
    const totalStock = _products.reduce((s,p)=>s+p.stock,0);
    const totalSold  = Object.values(_skuSales).reduce((s,v)=>s+v,0);

    document.getElementById('pageContent').innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:12px">
        <div><h2 style="font-weight:800">Product</h2><div style="color:var(--text-3);font-size:.85rem">${_products.length} produk aktif</div></div>
      </div>
      <div class="stat-grid" style="margin-bottom:18px">
        <div class="stat-card primary"><div class="stat-label">Total Produk</div><div class="stat-value">${_products.length}</div><div class="stat-sub">SKU aktif</div><div class="stat-icon">📦</div></div>
        <div class="stat-card"><div class="stat-label">Total Stok</div><div class="stat-value">${totalStock.toLocaleString('id-ID')}</div><div class="stat-sub">Unit tersedia</div><div class="stat-icon">🏷️</div></div>
        <div class="stat-card"><div class="stat-label">Terjual Periode Ini</div><div class="stat-value">${totalSold.toLocaleString('id-ID')}</div><div class="stat-sub">Unit terjual</div><div class="stat-icon">📈</div></div>
        <div class="stat-card"><div class="stat-label">Kategori</div><div class="stat-value">${Object.keys(cats).length}</div><div class="stat-sub">Jenis kategori</div><div class="stat-icon">📂</div></div>
      </div>
      <div class="two-col" style="margin-bottom:18px">
        <div class="card">
          <div class="card-header"><div class="card-header-left"><h3>Distribusi Kategori</h3></div></div>
          <div class="chart-container" style="height:200px"><canvas id="catChart"></canvas></div>
        </div>
        <div class="card">
          <div class="card-header"><div class="card-header-left"><h3>Stok per Kategori</h3></div></div>
          <div id="stockBars"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">
          <div class="card-header-left"><h3>Daftar Produk</h3></div>
          <div class="controls" style="margin:0">
            <input type="text" class="ctrl-input" placeholder="🔍 Cari SKU / nama..." oninput="_search=this.value;renderTable()" style="min-width:160px">
            <select class="ctrl-select" onchange="_catFilter=this.value;renderTable()">
              <option value="">Semua Kategori</option>
              ${[...new Set(_products.map(p=>p.category||'Lainnya'))].map(c=>`<option>${c}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Produk</th><th>SKU</th><th>Kategori</th>${isSPV?'<th>ADV</th>':''}<th>Harga</th><th>Stok</th><th>Terjual</th><th>Nilai Stok</th></tr></thead>
            <tbody id="productTable"></tbody>
          </table>
        </div>
      </div>
    `;

    // Category chart
    const catLabels = Object.keys(cats);
    if (_catChart) _catChart.destroy();
    _catChart = new Chart(document.getElementById('catChart'), {
      type:'doughnut',
      data:{ labels:catLabels, datasets:[{ data:catLabels.map(k=>cats[k]),
        backgroundColor:COLORS, borderWidth:3, borderColor:isDark()?'#1E293B':'#fff', hoverOffset:6 }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'60%',
        plugins:{ legend:{ position:'bottom', labels:{font:{size:11},color:chartTextColor()} } } }
    });

    // Stock bars
    const stockByCat = {};
    _products.forEach(p => { const c=p.category||'Lainnya'; stockByCat[c]=(stockByCat[c]||0)+p.stock; });
    const maxS = Math.max(...Object.values(stockByCat),1);
    document.getElementById('stockBars').innerHTML = Object.entries(stockByCat).map(([cat,stock],i) => `
      <div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:5px">
          <span style="font-weight:600">${cat}</span>
          <span style="color:var(--primary);font-weight:700">${stock.toLocaleString('id-ID')} unit</span>
        </div>
        <div class="progress"><div class="progress-fill" style="width:${(stock/maxS*100).toFixed(0)}%;background:${COLORS[i%COLORS.length]}"></div></div>
      </div>
    `).join('');

    renderTable();
  } catch(e) {
    showError('Gagal memuat data: ' + e.message);
  }
}

function renderTable() {
  const isSPV = _user.role === 'spv';
  let list = _products;
  if (_search) list = list.filter(p => p.name.toLowerCase().includes(_search.toLowerCase()) || p.sku.toLowerCase().includes(_search.toLowerCase()));
  if (_catFilter) list = list.filter(p => (p.category||'Lainnya') === _catFilter);

  const body = document.getElementById('productTable');
  if (!list.length) {
    body.innerHTML = `<tr><td colspan="${isSPV?8:7}" class="empty"><div class="icon">📭</div>Tidak ada produk</td></tr>`; return;
  }
  body.innerHTML = list.map(p => {
    const advP = p.profiles || {};
    const color = assignUserColor(_profiles, p.adv_id);
    const sold = _skuSales[p.sku] || 0;
    const sc = p.stock < 50 ? 'var(--danger)' : p.stock < 150 ? 'var(--warning)' : 'var(--success)';
    return `<tr>
      <td><div style="display:flex;align-items:center;gap:10px">
        <div style="width:36px;height:36px;border-radius:10px;background:rgba(67,97,238,.1);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0">${p.img||'📦'}</div>
        <span style="font-weight:600">${p.name}</span>
      </div></td>
      <td style="font-family:monospace;font-size:.76rem;color:var(--text-3)">${p.sku}</td>
      <td><span class="badge badge-primary">${p.category||'Lainnya'}</span></td>
      ${isSPV?`<td><div style="display:flex;align-items:center;gap:6px">
        <div class="user-avatar sm" style="background:${color};font-size:.65rem">${advP.avatar||'?'}</div>
        <span style="font-size:.82rem">${advP.name?.split(' ')[0]||'-'}</span>
      </div></td>`:''}
      <td style="font-weight:700">${fmtFull(p.price)}</td>
      <td><span style="font-weight:700;color:${sc}">${p.stock}</span></td>
      <td style="font-weight:700;color:var(--success)">${sold>0?sold+' unit':'<span style="color:var(--text-3)">-</span>'}</td>
      <td style="font-weight:700;color:var(--primary)">${fmt(p.price*p.stock)}</td>
    </tr>`;
  }).join('');
}
</script>
</body>
</html>
