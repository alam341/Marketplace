<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — MarketDash</title>
<link rel="stylesheet" href="css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-slot"></div>
  <div class="main-content">
    <div id="header-slot"></div>
    <div class="page">
      <div id="dateFilterContainer"></div>
      <div id="pageContent"></div>
    </div>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/upload.js"></script>
<script>
let _user, _profiles = [], _skuData = [], _skuChart;
let _search = '', _mpFilter = '';
const CANCEL_WORDS = ['batal','cancel','cancelled','canceled'];

(async () => {
  _user = await requireAuth();
  if (!_user) return;
  _profiles = await dbGetAllProfiles().catch(() => []);
  _user._color = _user.role === 'spv' ? '#EF233C' : assignUserColor(_profiles, _user.id);
  renderLayout('product', _user);
  renderDateFilter('dateFilterContainer', 'refreshPage');
  await refreshPage();
})();

function setMpFilter(mp) {
  _mpFilter = mp;
  document.querySelectorAll('.mp-filter-btn').forEach(b => {
    b.className = 'btn btn-sm ' + (b.dataset.mp === mp ? 'btn-primary' : 'btn-outline') + ' mp-filter-btn';
  });
  renderAll();
}

async function refreshPage() {
  showLoading();
  try {
    const { from, to } = window._dateFilter;
    const isSPV = _user.role === 'spv';
    const filters = { dateFrom: from, dateTo: to };
    if (!isSPV) filters.advId = _user.id;

    const orders = await dbGetAllMarketplaceOrders(filters);
    const valid = orders.filter(t => !CANCEL_WORDS.some(k => String(t.status||'').toLowerCase().includes(k)));

    const skuMap = {};
    valid.forEach(t => {
      const sku = t.sku || '-';
      if (!skuMap[sku]) skuMap[sku] = { sku, product: t.product || '-', shopee:0, tiktok:0, lazada:0, total_qty:0, total_omset:0 };
      skuMap[sku][t.marketplace] = (skuMap[sku][t.marketplace]||0) + (t.qty||0);
      skuMap[sku].total_qty   += (t.qty||0);
      skuMap[sku].total_omset += (t.total||0);
    });

    _skuData = Object.values(skuMap).sort((a,b) => b.total_qty - a.total_qty);

    document.getElementById('pageContent').innerHTML = `
      <div style="margin-bottom:14px">
        <h2 style="font-weight:800;margin-bottom:4px">Penjualan per Produk</h2>
        <div style="color:var(--text-3);font-size:.85rem">Exclude dibatalkan</div>
      </div>

      <div class="card" style="margin-bottom:18px;padding:14px 18px">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span style="font-size:.82rem;font-weight:700;color:var(--text-3)">Platform:</span>
          <button class="btn btn-primary btn-sm mp-filter-btn" data-mp="" onclick="setMpFilter('')">Semua</button>
          <button class="btn btn-outline btn-sm mp-filter-btn" data-mp="shopee" onclick="setMpFilter('shopee')" style="color:#EE4D2D;border-color:#EE4D2D">Shopee</button>
          <button class="btn btn-outline btn-sm mp-filter-btn" data-mp="tiktok" onclick="setMpFilter('tiktok')" style="color:#888;border-color:#888">TikTok</button>
          <button class="btn btn-outline btn-sm mp-filter-btn" data-mp="lazada" onclick="setMpFilter('lazada')" style="color:#0F146D;border-color:#0F146D">Lazada</button>
        </div>
      </div>

      <div class="stat-grid" id="statCards" style="margin-bottom:18px"></div>

      <div class="card" style="margin-bottom:18px">
        <div class="card-header"><div class="card-header-left"><h3>Top 5 SKU Terjual</h3><div class="card-sub" id="chartSub">Semua marketplace</div></div></div>
        <div class="chart-container" style="height:220px"><canvas id="skuChart"></canvas></div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-header-left"><h3 id="tableTitle">Detail per SKU</h3></div>
          <div class="controls" style="margin:0">
            <input type="text" class="ctrl-input" placeholder="🔍 Cari SKU / nama..." oninput="_search=this.value;renderTable()" style="min-width:160px">
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr id="productTableHead">
              <th>#</th><th>Nama Produk</th><th>SKU</th>
              <th style="color:#EE4D2D">Shopee</th>
              <th style="color:#888">TikTok</th>
              <th style="color:#0F146D">Lazada</th>
              <th>Total Qty</th><th>Total Omset</th>
            </tr></thead>
            <tbody id="productTable"></tbody>
          </table>
        </div>
      </div>
    `;

    renderAll();
  } catch(e) {
    showError('Gagal memuat data: ' + e.message);
  }
}

function renderAll() {
  const mp = _mpFilter;
  const mpLabel = { '':'Semua marketplace', shopee:'Shopee', tiktok:'TikTok Shop', lazada:'Lazada' }[mp];

  // Filter data berdasarkan platform
  const filtered = mp ? _skuData.filter(d => d[mp] > 0) : _skuData;

  const totalSKU   = filtered.length;
  const totalQty   = filtered.reduce((s,d) => s + (mp ? d[mp] : d.total_qty), 0);
  const totalOmset = filtered.reduce((s,d) => s + d.total_omset, 0);
  const topSKU     = filtered[0]?.product || '-';

  document.getElementById('statCards').innerHTML = `
    <div class="stat-card primary"><div class="stat-label">Total SKU Terjual</div><div class="stat-value">${totalSKU}</div><div class="stat-sub">Produk berbeda</div><div class="stat-icon">📦</div></div>
    <div class="stat-card"><div class="stat-label">Total Qty Terjual</div><div class="stat-value">${totalQty.toLocaleString('id-ID')}</div><div class="stat-sub">Unit</div><div class="stat-icon">📈</div></div>
    <div class="stat-card"><div class="stat-label">Total Omset</div><div class="stat-value" style="font-size:1.1rem">${fmtFull(totalOmset)}</div><div class="stat-sub">${mpLabel}</div><div class="stat-icon">💰</div></div>
    <div class="stat-card"><div class="stat-label">Produk Terlaris</div><div class="stat-value" style="font-size:.95rem;line-height:1.3">${topSKU}</div><div class="stat-sub">Qty tertinggi</div><div class="stat-icon">🏆</div></div>
  `;

  if (document.getElementById('chartSub')) document.getElementById('chartSub').textContent = mpLabel;
  if (document.getElementById('tableTitle')) document.getElementById('tableTitle').textContent = `Detail per SKU — ${mpLabel}`;

  // Chart top 5
  const top5 = filtered.slice(0, 5);
  const tc = chartTextColor(), gc = chartGridColor();
  if (_skuChart) _skuChart.destroy();
  if (document.getElementById('skuChart')) {
    const datasets = mp
      ? [{ label: mpLabel, data: top5.map(d=>d[mp]), backgroundColor: {shopee:'#EE4D2D',tiktok:'#888',lazada:'#0F146D'}[mp], borderRadius:4 }]
      : [
          { label:'Shopee', data:top5.map(d=>d.shopee), backgroundColor:'#EE4D2D', borderRadius:4 },
          { label:'TikTok', data:top5.map(d=>d.tiktok), backgroundColor:'#888',    borderRadius:4 },
          { label:'Lazada', data:top5.map(d=>d.lazada), backgroundColor:'#0F146D', borderRadius:4 },
        ];
    _skuChart = new Chart(document.getElementById('skuChart'), {
      type:'bar',
      data:{ labels:top5.map(d=>d.product.length>22?d.product.slice(0,22)+'…':d.product), datasets },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'top', labels:{font:{size:11},color:tc} } },
        scales:{ x:{stacked:true,grid:{display:false},ticks:{color:tc}}, y:{stacked:true,grid:{color:gc},ticks:{color:tc}} } }
    });
  }

  renderTable();
}

function renderTable() {
  let list = _skuData;
  if (_search) list = list.filter(d =>
    d.product.toLowerCase().includes(_search.toLowerCase()) ||
    d.sku.toLowerCase().includes(_search.toLowerCase())
  );
  if (_mpFilter) list = list.filter(d => d[_mpFilter] > 0);

  const mp = _mpFilter;
  const showShopee = !mp || mp === 'shopee';
  const showTiktok = !mp || mp === 'tiktok';
  const showLazada = !mp || mp === 'lazada';

  // Update header
  document.getElementById('productTableHead').innerHTML = `
    <th>#</th><th>Nama Produk</th><th>SKU</th>
    ${showShopee ? '<th style="color:#EE4D2D">Shopee</th>' : ''}
    ${showTiktok ? '<th style="color:#888">TikTok</th>' : ''}
    ${showLazada ? '<th style="color:#0F146D">Lazada</th>' : ''}
    <th>Total Qty</th><th>Total Omset</th>
  `;

  const body = document.getElementById('productTable');
  if (!list.length) {
    body.innerHTML = `<tr><td colspan="8" class="empty"><div class="icon">📭</div>Tidak ada data</td></tr>`; return;
  }

  const dash = `<span style="color:var(--text-3)">-</span>`;
  body.innerHTML = list.map((d, i) => {
    const qty = mp ? d[mp] : d.total_qty;
    return `<tr>
      <td style="color:var(--text-3);font-size:.8rem">${i+1}</td>
      <td style="font-weight:600">${d.product}</td>
      <td style="font-family:monospace;font-size:.75rem;color:var(--text-3)">${d.sku}</td>
      ${showShopee ? `<td style="font-weight:700;color:#EE4D2D">${d.shopee > 0 ? d.shopee+' unit' : dash}</td>` : ''}
      ${showTiktok ? `<td style="font-weight:700;color:#888">${d.tiktok > 0 ? d.tiktok+' unit' : dash}</td>` : ''}
      ${showLazada ? `<td style="font-weight:700;color:#0F146D">${d.lazada > 0 ? d.lazada+' unit' : dash}</td>` : ''}
      <td style="font-weight:800">${qty.toLocaleString('id-ID')} unit</td>
      <td style="font-weight:800;color:var(--primary)">${fmtFull(d.total_omset)}</td>
    </tr>`;
  }).join('');
}
</script>
</body>
</html>
