<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — MarketDash</title>
<link rel="stylesheet" href="css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-slot"></div>
  <div class="main-content">
    <div id="header-slot"></div>
    <div class="page" id="pageContent"></div>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
const user = requireAuth();
if (user) { renderLayout('product', user); renderProduct(user); }

function renderProduct(user) {
  const isSPV = user.role === 'spv';
  const products = isSPV ? PRODUCTS : PRODUCTS.filter(p => p.adv === user.id);

  // Category stats
  const cats = {};
  products.forEach(p => { cats[p.category] = (cats[p.category]||0) + 1; });
  const totalStock = products.reduce((s,p) => s+p.stock, 0);

  document.getElementById('pageContent').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px">
      <div>
        <h2 style="font-weight:800">Produk</h2>
        <div style="color:#8A94A6;font-size:.85rem">${products.length} produk aktif</div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stat-grid" style="margin-bottom:18px">
      <div class="stat-card primary">
        <div class="stat-label">Total Produk</div>
        <div class="stat-value">${products.length}</div>
        <div class="stat-sub">SKU aktif</div>
        <div class="stat-icon">📦</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Stok</div>
        <div class="stat-value">${totalStock.toLocaleString('id-ID')}</div>
        <div class="stat-sub">Unit tersedia</div>
        <div class="stat-icon">🏷️</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Kategori</div>
        <div class="stat-value">${Object.keys(cats).length}</div>
        <div class="stat-sub">Jenis kategori</div>
        <div class="stat-icon">📂</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Rata-rata Harga</div>
        <div class="stat-value">${fmt(products.reduce((s,p)=>s+p.price,0)/products.length)}</div>
        <div class="stat-sub">Per produk</div>
        <div class="stat-icon">💵</div>
      </div>
    </div>

    <div class="two-col" style="margin-bottom:18px">
      <!-- Category chart -->
      <div class="card">
        <div class="card-header">
          <div class="card-header-left"><h3>Distribusi Kategori</h3></div>
        </div>
        <div class="chart-container" style="height:200px">
          <canvas id="catChart"></canvas>
        </div>
      </div>
      <!-- Stock status -->
      <div class="card">
        <div class="card-header">
          <div class="card-header-left"><h3>Stok per Kategori</h3></div>
        </div>
        <div id="stockBars"></div>
      </div>
    </div>

    <!-- Product table -->
    <div class="card">
      <div class="card-header">
        <div class="card-header-left"><h3>Daftar Produk</h3></div>
        <div class="controls" style="margin:0">
          <input type="text" class="ctrl-input" placeholder="🔍 Cari SKU / nama..." oninput="filterProducts(this.value)" style="min-width:180px">
          <select class="ctrl-select" onchange="filterByCategory(this.value)" id="catFilter">
            <option value="">Semua Kategori</option>
            ${[...new Set(products.map(p=>p.category))].map(c=>`<option value="${c}">${c}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Produk</th><th>SKU</th><th>Kategori</th>
            ${isSPV ? '<th>ADV</th>' : ''}
            <th>Harga</th><th>Stok</th><th>Nilai Stok</th>
          </tr></thead>
          <tbody id="productTable">
            ${renderProductRows(products, isSPV)}
          </tbody>
        </table>
      </div>
    </div>
  `;

  // Category pie chart
  const catLabels = Object.keys(cats);
  const catVals   = catLabels.map(k => cats[k]);
  const colors    = ['#4361EE','#EE4D2D','#06C270','#FFB703','#7B2FBE'];

  new Chart(document.getElementById('catChart'), {
    type: 'doughnut',
    data: {
      labels: catLabels,
      datasets: [{ data: catVals, backgroundColor: colors, borderWidth:3, borderColor:'#fff', hoverOffset:6 }]
    },
    options: { responsive:true, maintainAspectRatio:false, cutout:'60%',
      plugins:{ legend:{ position:'bottom', labels:{ font:{size:11} } } } }
  });

  // Stock bars
  const stockByCat = {};
  products.forEach(p => { stockByCat[p.category] = (stockByCat[p.category]||0) + p.stock; });
  const maxStock = Math.max(...Object.values(stockByCat));
  document.getElementById('stockBars').innerHTML = Object.entries(stockByCat).map(([cat, stock], i) => `
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:5px">
        <span style="font-weight:600">${cat}</span>
        <span style="color:#4361EE;font-weight:700">${stock.toLocaleString('id-ID')} unit</span>
      </div>
      <div class="progress">
        <div class="progress-fill" style="width:${(stock/maxStock*100).toFixed(0)}%;background:${colors[i]}"></div>
      </div>
    </div>
  `).join('');

  window._allProducts = products;
  window._isSPV = isSPV;
}

function renderProductRows(list, isSPV) {
  if (!list.length) return `<tr><td colspan="${isSPV?7:6}" class="empty"><div class="icon">📭</div>Tidak ada produk</td></tr>`;
  return list.map(p => {
    const advUser = getUser(p.adv);
    const stockColor = p.stock < 100 ? '#EF233C' : p.stock < 200 ? '#FFB703' : '#06C270';
    return `
      <tr>
        <td>
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:36px;height:36px;border-radius:10px;background:#F0F3FF;display:flex;align-items:center;justify-content:center;font-size:1.2rem">${p.img}</div>
            <span style="font-weight:600">${p.name}</span>
          </div>
        </td>
        <td style="font-family:monospace;font-size:.78rem;color:#8A94A6">${p.sku}</td>
        <td><span class="badge badge-primary">${p.category}</span></td>
        ${isSPV ? `<td><div style="display:flex;align-items:center;gap:6px"><div class="user-avatar sm" style="background:#4361EE;font-size:.65rem">${advUser?.avatar||'?'}</div>${advUser?.name.split(' ')[0]||'-'}</div></td>` : ''}
        <td style="font-weight:700">${fmtFull(p.price)}</td>
        <td><span style="font-weight:700;color:${stockColor}">${p.stock}</span></td>
        <td style="font-weight:700;color:#4361EE">${fmt(p.price * p.stock)}</td>
      </tr>
    `;
  }).join('');
}

let _catFilter = '', _searchFilter = '';
function filterProducts(q) {
  _searchFilter = q.toLowerCase();
  applyFilters();
}
function filterByCategory(cat) {
  _catFilter = cat;
  applyFilters();
}
function applyFilters() {
  let list = window._allProducts || [];
  if (_catFilter) list = list.filter(p => p.category === _catFilter);
  if (_searchFilter) list = list.filter(p => p.name.toLowerCase().includes(_searchFilter) || p.sku.toLowerCase().includes(_searchFilter));
  document.getElementById('productTable').innerHTML = renderProductRows(list, window._isSPV);
}
</script>
</body>
</html>
