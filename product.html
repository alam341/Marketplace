<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — MarketDash</title>
<link rel="stylesheet" href="css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-slot"></div>
  <div class="main-content">
    <div id="header-slot"></div>
    <div class="page">
      <div id="dateFilterContainer"></div>
      <div id="pageContent"></div>
    </div>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/upload.js"></script>
<script>
let _user, _profiles = [], _skuData = [], _skuChart;
let _search = '', _mpFilter = '';
const CANCEL_WORDS = ['batal','cancel','cancelled','canceled'];

(async () => {
  _user = await requireAuth();
  if (!_user) return;
  _profiles = await dbGetAllProfiles().catch(() => []);
  _user._color = _user.role === 'spv' ? '#EF233C' : assignUserColor(_profiles, _user.id);
  renderLayout('product', _user);
  renderDateFilter('dateFilterContainer', 'refreshPage');
  await refreshPage();
})();

async function refreshPage() {
  showLoading();
  try {
    const { from, to } = window._dateFilter;
    const isSPV = _user.role === 'spv';
    const filters = { dateFrom: from, dateTo: to };
    if (!isSPV) filters.advId = _user.id;

    const orders = await dbGetAllMarketplaceOrders(filters);

    // Exclude cancelled
    const valid = orders.filter(t => !CANCEL_WORDS.some(k => String(t.status||'').toLowerCase().includes(k)));

    // Group by SKU
    const skuMap = {};
    valid.forEach(t => {
      const sku = t.sku || '-';
      if (!skuMap[sku]) skuMap[sku] = {
        sku, product: t.product || '-',
        shopee: 0, tiktok: 0, lazada: 0,
        total_qty: 0, total_omset: 0,
      };
      skuMap[sku][t.marketplace] = (skuMap[sku][t.marketplace] || 0) + (t.qty || 0);
      skuMap[sku].total_qty   += (t.qty || 0);
      skuMap[sku].total_omset += (t.total || 0);
    });

    _skuData = Object.values(skuMap).sort((a, b) => b.total_qty - a.total_qty);

    const totalSKU   = _skuData.length;
    const totalQty   = _skuData.reduce((s, d) => s + d.total_qty, 0);
    const totalOmset = _skuData.reduce((s, d) => s + d.total_omset, 0);
    const topSKU     = _skuData[0]?.product || '-';

    // Top 5 SKU untuk chart
    const top5 = _skuData.slice(0, 5);

    document.getElementById('pageContent').innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:12px">
        <div><h2 style="font-weight:800">Penjualan per Produk</h2>
        <div style="color:var(--text-3);font-size:.85rem">Data dari semua marketplace · exclude dibatalkan</div></div>
      </div>

      <div class="stat-grid" style="margin-bottom:18px">
        <div class="stat-card primary"><div class="stat-label">Total SKU Terjual</div><div class="stat-value">${totalSKU}</div><div class="stat-sub">Produk berbeda</div><div class="stat-icon">📦</div></div>
        <div class="stat-card"><div class="stat-label">Total Qty Terjual</div><div class="stat-value">${totalQty.toLocaleString('id-ID')}</div><div class="stat-sub">Unit</div><div class="stat-icon">📈</div></div>
        <div class="stat-card"><div class="stat-label">Total Omset</div><div class="stat-value">${fmt(totalOmset)}</div><div class="stat-sub">Semua marketplace</div><div class="stat-icon">💰</div></div>
        <div class="stat-card"><div class="stat-label">Produk Terlaris</div><div class="stat-value" style="font-size:1rem;line-height:1.3">${topSKU}</div><div class="stat-sub">Qty tertinggi</div><div class="stat-icon">🏆</div></div>
      </div>

      <div class="card" style="margin-bottom:18px">
        <div class="card-header"><div class="card-header-left"><h3>Top 5 SKU Terjual</h3><div class="card-sub">Berdasarkan total qty</div></div></div>
        <div class="chart-container" style="height:220px"><canvas id="skuChart"></canvas></div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-header-left"><h3>Detail per SKU</h3></div>
          <div class="controls" style="margin:0">
            <input type="text" class="ctrl-input" placeholder="🔍 Cari SKU / nama..." oninput="_search=this.value;renderTable()" style="min-width:160px">
            <select class="ctrl-select" onchange="_mpFilter=this.value;renderTable()">
              <option value="">Semua Marketplace</option>
              <option value="shopee">Shopee</option>
              <option value="tiktok">TikTok</option>
              <option value="lazada">Lazada</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>#</th><th>Nama Produk</th><th>SKU</th>
              <th style="color:#EE4D2D">Shopee</th>
              <th style="color:#888">TikTok</th>
              <th style="color:#0F146D">Lazada</th>
              <th>Total Qty</th><th>Total Omset</th>
            </tr></thead>
            <tbody id="productTable"></tbody>
          </table>
        </div>
      </div>
    `;

    // Chart top 5
    const tc = chartTextColor(), gc = chartGridColor();
    if (_skuChart) _skuChart.destroy();
    _skuChart = new Chart(document.getElementById('skuChart'), {
      type: 'bar',
      data: {
        labels: top5.map(d => d.product.length > 20 ? d.product.slice(0,20)+'…' : d.product),
        datasets: [
          { label:'Shopee', data: top5.map(d=>d.shopee), backgroundColor:'#EE4D2D', borderRadius:4 },
          { label:'TikTok', data: top5.map(d=>d.tiktok), backgroundColor:'#888',    borderRadius:4 },
          { label:'Lazada', data: top5.map(d=>d.lazada), backgroundColor:'#0F146D', borderRadius:4 },
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position:'top', labels:{font:{size:11},color:tc} } },
        scales: {
          x: { stacked:true, grid:{display:false}, ticks:{color:tc} },
          y: { stacked:true, grid:{color:gc}, ticks:{color:tc} }
        }
      }
    });

    renderTable();
  } catch(e) {
    showError('Gagal memuat data: ' + e.message);
  }
}

function renderTable() {
  let list = _skuData;
  if (_search) list = list.filter(d =>
    d.product.toLowerCase().includes(_search.toLowerCase()) ||
    d.sku.toLowerCase().includes(_search.toLowerCase())
  );
  if (_mpFilter) list = list.filter(d => d[_mpFilter] > 0);

  const body = document.getElementById('productTable');
  if (!list.length) {
    body.innerHTML = `<tr><td colspan="8" class="empty"><div class="icon">📭</div>Tidak ada data</td></tr>`; return;
  }

  body.innerHTML = list.map((d, i) => `
    <tr>
      <td style="color:var(--text-3);font-size:.8rem">${i+1}</td>
      <td style="font-weight:600">${d.product}</td>
      <td style="font-family:monospace;font-size:.75rem;color:var(--text-3)">${d.sku}</td>
      <td style="font-weight:700;color:#EE4D2D">${d.shopee > 0 ? d.shopee+' unit' : '<span style="color:var(--text-3)">-</span>'}</td>
      <td style="font-weight:700;color:#888">${d.tiktok > 0 ? d.tiktok+' unit' : '<span style="color:var(--text-3)">-</span>'}</td>
      <td style="font-weight:700;color:#0F146D">${d.lazada > 0 ? d.lazada+' unit' : '<span style="color:var(--text-3)">-</span>'}</td>
      <td style="font-weight:800">${d.total_qty.toLocaleString('id-ID')} unit</td>
      <td style="font-weight:800;color:var(--primary)">${fmt(d.total_omset)}</td>
    </tr>
  `).join('');
}
</script>
</body>
</html>
